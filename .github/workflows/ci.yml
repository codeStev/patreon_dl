name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*.*.*"]
  pull_request:
  # Manual on-demand run from the GitHub UI ("Run workflow") or `gh workflow
  # run ci.yml`. By default this only reaches the build/test/docker jobs
  # below, same as a PR - the `publish` input is an explicit opt-in for also
  # pushing the image to the registry (and, when run against a vX.Y.Z tag
  # ref via the "Use workflow from" picker, cutting a release), so a routine
  # "does this still build" run never accidentally publishes anything.
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the image to the registry (and cut a release, if run against a vX.Y.Z tag)"
        type: boolean
        default: false

# Only the latest run per ref matters; cancel superseded ones.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: CI only needs to read the repo.
permissions:
  contents: read

jobs:
  backend:
    name: Backend (build + test)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle
      # Unit + Testcontainers integration tests; the runner's Docker daemon
      # backs Testcontainers. Multi-module build, Gradle wrapper at repo root.
      - name: Build and test
        run: ./gradlew --no-daemon --build-cache build

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Typecheck and build
        working-directory: frontend
        run: npm run build

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # Verifies the combined Dockerfile builds (backend + frontend static
      # assets in one image); does not push anywhere. Only one image for
      # this project (no separate backend/frontend split).
      - name: Build combined image
        run: docker build -f deploy/combined/Dockerfile -t patreon-ingest-bot:ci .

  publish:
    name: Publish image to private registry
    runs-on: ubuntu-latest
    needs: [backend, docker]
    # Every push to main keeps `latest` (+ commit SHA) current; a `vX.Y.Z`
    # release tag additionally publishes immutable semver-tagged images. A
    # manual dispatch reaches this job only with `publish` explicitly
    # checked - otherwise it's a build-only run. Nothing else (PRs, other
    # branches) reaches this job.
    if: |
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) &&
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish))
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # Joins the tailnet for this job only, as an ephemeral node; the
      # registry is reachable only from the tailnet.
      - name: Connect to tailnet
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_CLIENT_SECRET }}
          tags: tag:ci
      # The registry sits behind a self-signed internal CA, so Docker won't
      # trust it by default. certs.d is per-registry and needs no daemon
      # restart; the "docker" buildx driver delegates to the host daemon
      # (unlike the container-based driver) so it honors certs.d too.
      - name: Trust registry CA certificate
        run: |
          sudo mkdir -p "/etc/docker/certs.d/${{ vars.REGISTRY_HOST }}"
          printf '%s\n' "${{ secrets.REGISTRY_CA_CERT }}" | \
            sudo tee "/etc/docker/certs.d/${{ vars.REGISTRY_HOST }}/ca.crt" > /dev/null
      - uses: docker/setup-buildx-action@v4
        with:
          driver: docker
      - name: Log in to registry
        uses: docker/login-action@v4
        with:
          registry: ${{ vars.REGISTRY_HOST }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      # latest/sha/<shortsha>-snapshot on every main push; vX.Y.Z/vX.Y/vX
      # and <version>-release only on a matching release tag push
      # (is_default_branch gates the main-only tags).
      - name: Image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ vars.REGISTRY_HOST }}/patreon-ingest-bot
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,enable={{is_default_branch}}
            type=sha,format=short,prefix=,suffix=-snapshot,enable={{is_default_branch}}
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=semver,pattern=v{{major}}
            type=semver,pattern={{version}},suffix=-release
      - name: Build and push combined image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/combined/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [publish]
    # Only a `vX.Y.Z` tag ref cuts a release; a plain main push never
    # reaches this job. A manual dispatch reaches it only when `publish` is
    # checked and it's run against an existing vX.Y.Z tag - re-running
    # against a tag that already has a release fails loudly at the `gh
    # release create` step below rather than silently duplicating one.
    if: |
      startsWith(github.ref, 'refs/tags/v') &&
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish))
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Create release with auto-generated notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" --generate-notes
